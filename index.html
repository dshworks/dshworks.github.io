<!--
  This file is the fallback, not the front door.

  dsh.works/ is served by a Cloudflare Worker (dshworks/plugins), which owns
  the apex root plus /p/*, /tag/*, /api/*, /llms.txt and /sitemap.xml. The
  project pages under /awesome-dsh-plugins/, /awesome-dsh-themes/, /dsh-meter/
  and /dsh-crew/ are untouched and still served from GitHub Pages.

  A Cloudflare route pattern is matched against the whole URL including the
  query string, so "dsh.works/?utm_source=x" misses the Worker route and
  arrives HERE. The query-tolerant pattern "dsh.works/?*" is not a way out:
  the API now rejects it outright (error 10022) and used to accept it and
  silently drop it. A greedy "dsh.works/*" would work and would swallow the
  four project sites above, which the Worker cannot proxy back — the github.io
  origin 301s to dsh.works for every path, so forwarding loops.

  So this page has to be good at one job: a link someone shared, with a
  tracking parameter on it, landing here instead of on the site.

  That makes the metadata the point. Social unfurlers read the HTML they are
  given and do not follow a meta refresh, so without the tags below every link
  posted to Slack, Discord, X or HN rendered as a bare "dsh.works" with no
  description — the site's best traffic arriving looking like a parked domain.
  The tags are duplicated from the Worker's own <head> deliberately; two files
  is the cost of the routing split, and a wrong preview is worse than a
  duplicated string.

  No robots noindex: the canonical already points at the real page, and some
  unfurlers treat noindex as a reason to render nothing at all.

  The landing page this replaced is kept verbatim at
  _archive/index-2026-08-18.html.
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="dsh.works">
<meta property="og:url" content="https://dsh.works/">
<meta property="og:title" content="dsh.works — should you install it?">
<meta property="og:description" content="Twenty-two directories list DeepSeek Harness plugins and all of them answer what exists. This one answers whether to install it: the file that proves the install path, measured against a topic where 93% of repos were created the week dsh shipped.">
