<style>
/* Same tokens as the landing page — see index.html for why each colour is
 * declared twice. */
:root {
  color-scheme: light dark;
  --bg: #000000;
  --bg: light-dark(#fbfaf7, #000000);
  --text: #e8e8e8;
  --text: light-dark(#17171a, #e8e8e8);
  --muted: #9a9a9a;
  --muted: light-dark(#5a5a60, #9a9a9a);
  --strong: #ffffff;
  --strong: light-dark(#000000, #ffffff);
  --cyan: #00c2e9;
  --cyan: light-dark(#0a6e85, #00c2e9);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] { color-scheme: only light; }
:root[data-theme="dark"] { color-scheme: only dark; }

body {
  margin: 0 auto;
  padding: 5rem 1.5rem;
  max-width: 40rem;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 var(--mono);
  font-variant-ligatures: none;
}
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--cyan); color: var(--bg); }
h1 { color: var(--strong); font-size: 2rem; margin: 0 0 0.75rem; letter-spacing: -0.01em; }
h1 .caret { color: var(--cyan); }
p { color: var(--muted); margin: 0 0 1rem; }
nav { display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.85rem; }
</style>
